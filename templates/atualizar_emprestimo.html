<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atualizar Empréstimo #{{ emprestimo.ID }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm border-0 p-4">
                    <h3 class="fw-bold text-primary mb-4">Atualizar Status do Empréstimo #{{ emprestimo.ID }}</h3>

                    <form action="/emprestimos/finalizar/{{ emprestimo.ID }}" method="POST">
                        <!-- Nome do Colaborador (Apenas visualização) -->
                        <div class="mb-3">
                            <label class="form-label text-muted fw-bold mb-0">Colaborador:</label>
                            <p class="fs-5 text-dark">{{ emprestimo.Colaborador }}</p>
                        </div>

                        <!-- Selecionar Novo Status -->
                        <div class="mb-3">
                            <label for="status" class="form-label">Novo Status de Encerramento</label>
                            <select class="form-select" id="status" name="status" required onchange="controlarObservacao()">
                                <option value="" disabled selected>Selecione o status...</option>
                                <option value="Devolvido">Devolvido</option>
                                <option value="Danificado">Danificado</option>
                                <option value="Perdido">Perdido</option>
                            </select>
                        </div>

                        <!-- Caixa de Texto para Observação (Oculta por padrão, aparece se Danificado ou Perdido) -->
                        <div class="mb-3 d-none" id="blocoObservacao">
                            <label for="observacao_devolucao" class="form-label">Observação / Justificativa</label>
                            <textarea class="form-control" id="observacao_devolucao" name="observacao_devolucao" rows="3" maxlength="500" placeholder="Descreva os detalhes do dano ou motivo do extravio..."></textarea>
                            <div class="form-text text-muted">Máximo de 500 caracteres.</div>
                        </div>

                        <!-- Botões -->
                        <div class="d-flex justify-content-between mt-4">
                            <a href="/emprestimos" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-success">Confirmar Atualização</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Script para exibir/ocultar a caixa de observação dinamicamente -->
    <script>
        function controlarObservacao() {
            const statusSelect = document.getElementById('status').value;
            const blocoObs = document.getElementById('blocoObservacao');
            const inputObs = document.getElementById('observacao_devolucao');

            if (statusSelect === 'Danificado' || statusSelect === 'Perdido') {
                blocoObs.classList.remove('d-none');
                inputObs.setAttribute('required', 'required');
            } else {
                blocoObs.classList.add('d-none');
                inputObs.removeAttribute('required');
                inputObs.value = '';
            }
        }
    </script>
</body>
</html>
