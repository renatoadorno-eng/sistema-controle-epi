<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Equipamento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm border-0 p-4">
                    <h3 class="fw-bold text-dark mb-3">Editar Equipamento</h3>
                    
                    <form action="/equipamentos/editar/{{ equipamento.ID }}" method="POST">
                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome</label>
                            <input type="text" class="form-control" id="nome" name="nome" value="{{ equipamento.Nome }}" required>
                        </div>
                        <div class="mb-3">
                            <label for="qtd_estoque" class="form-label">Estoque</label>
                            <input type="number" class="form-control" id="qtd_estoque" name="qtd_estoque" value="{{ equipamento.QTD_estoque }}" required>
                        </div>
                        <div class="d-flex justify-content-between">
                            <a href="/equipamentos" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-primary">Salvar Alterações</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
