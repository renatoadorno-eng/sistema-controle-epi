<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Equipamento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5">
        <!-- Título e Botão de Voltar -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold text-dark">GERENCIAR EQUIPAMENTO</h2>
            <a href="/" class="btn btn-secondary">Voltar ao Menu</a>
        </div>

        <div class="row g-4">
            <!-- Formulário de Novo Equipamento -->
            <div class="col-md-4">
                <div class="card shadow-sm border-0 p-3">
                    <h5 class="card-title text-primary mb-3">Novo Equipamento</h5>
                    <form action="/equipamentos" method="POST">
                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome</label>
                            <input type="text" class="form-control" id="nome" name="nome" required>
                        </div>
                        <div class="mb-3">
                            <label for="qtd_estoque" class="form-label">Estoque</label>
                            <input type="number" class="form-control" id="qtd_estoque" name="qtd_estoque" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Cadastrar</button>
                    </form>
                </div>
            </div>

            <!-- Coluna da Direita (Pesquisa + Tabela) -->
            <div class="col-md-8">
                <!-- Barra de pesquisa por ID -->
                <div class="mb-3">
                    <input type="text" class="form-control" id="pesquisaID" placeholder="Pesquisar por ID equipamento">
                </div>

                <!-- Tabela de Listagem -->
                <div class="card shadow-sm border-0 p-3">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover align-middle">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>NOME</th>
                                    <th>ESTOQUE</th>
                                    <th>AÇÕES</th>
                                </tr>
                            </thead>
                            <tbody>
                                {% if equipamentos %}
                                    {% for e in equipamentos %}
                                    <tr>
                                        <td>{{ e.ID }}</td>
                                        <td>{{ e.Nome }}</td>
                                        <td>{{ e.QTD_estoque }}</td>
                                        <td>
                                            <a href="/equipamentos/editar/{{ e.ID }}" class="btn btn-warning btn-sm">EDITAR</a>
                                            <a href="/equipamentos/excluir/{{ e.ID }}" class="btn btn-danger btn-sm" onclick="return confirm('Tem certeza que deseja excluir este equipamento?')">EXCLUIR</a>
                                        </td>
                                    </tr>
                                    {% endfor %}
                                {% else %}
                                    <tr>
                                        <td colspan="4" class="text-center text-muted">Nenhum equipamento cadastrado ainda.</td>
                                    </tr>
                                {% endif %}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script de Filtro em Tempo Real por ID -->
    <script>
        document.getElementById('pesquisaID').addEventListener('keyup', function() {
            var termo = this.value.toLowerCase();
            var linhas = document.querySelectorAll('table tbody tr');

            linhas.forEach(function(linha) {
                var colunaID = linha.getElementsByTagName('td')[0];
                if (colunaID) {
                    var textoID = colunaID.textContent.toLowerCase();
                    if (textoID.indexOf(termo) > -1 || termo === '') {
                        linha.style.display = '';
                    } else {
                        linha.style.display = 'none';
                    }
                }
            });
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
