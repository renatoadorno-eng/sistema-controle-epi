<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gestão de EPIs</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100 m-0">

    <div class="card shadow-sm p-4" style="width: 380px; border-radius: 12px;">
        <!--Cabeçalho-->
        <div class="text-center mb-4">
            <h4 class="fw-bold text-primary mb-1">
                Controle de EPIs
            </h4>
            <span class="text-muted small">Autenticação do técnico de segurança</span>
        </div>

        <!--Mensagem de erro de login-->
        {% with messages = get_flashed_messages
        (with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show p-2 small" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close p-2" data-bs-dismiss="alert" aria-label="close"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        <form action="{{ url_for('login') }}" method="post">
            <div class="mb-3">
                <label for="email" class="form-label fw-semibold text-secondary">E-mail</label>
                <input type="text" name="email" id="email" class="form-control" placeholder="tecnico@empresa.com" required>
            </div>

            <div class="mb-3">
                <label for="senha" class="form-label fw-semibold text-secondary">Senha</label>
                <input type="password" name="senha" id="senha" class="form-control" placeholder="********" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 mt-2 fw-semibold">Login</button>
        </form>
    </div>
    <!--JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</body>
</html>
